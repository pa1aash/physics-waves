# Run configuration. Solver-dependent values were resolved in Session L5 by
# scripts/resolve_configs.py, which states the policy behind each one.
# Validates against configs/_schema.yaml.
#
# SCOPE DECISION (Session L4b, Option B) -- do not re-litigate.
# This eigenvalue problem is deliberately NONDIVERGENT. Extending it to the full
# divergent shallow-water system was investigated and found to be established
# ground (Paldor, Shamir & Garfinkel 2020; White & Staniforth 2009), so the
# nondivergent scope is a considered choice rather than an oversight. Growth
# rates are therefore nondivergent MODAL growth rates and carry a one-signed
# formulation bias -- nondivergent overestimates. Rationale and costing:
# docs/literature/DIVERGENT_STABILITY_DECISION.md
run_id: EVP-jet-stability
campaign: evp
