name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Repository hygiene (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run repository-hygiene tests
        run: python -m pytest tests/test_repo_hygiene.py -v

  environment:
    name: Solver environment (report, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}
      - name: Set up miniforge and create the pw environment
        uses: conda-incubator/setup-miniconda@v3
        continue-on-error: true
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: pw
          use-mamba: true
          channels: conda-forge
          channel-priority: strict
      - name: Run environment tests (Dedalus build may fail on the runner)
        shell: bash -el {0}
        continue-on-error: true
        run: python -m pytest tests/test_environment.py -v
