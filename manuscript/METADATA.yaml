declarations:
  funding: >-
    This research received no specific grant from any funding agency in the
    public, commercial, or not-for-profit sectors.

  competing_interests: >-
    The author declares no competing interests.

  ethics_approval: >-
    Not applicable. This is a purely computational study involving no human
    participants and no animal subjects, and therefore requires no ethics
    approval.

  consent_to_participate: >-
    Not applicable. This study involved no human participants.

  consent_for_publication: >-
    Not applicable. This manuscript contains no individual person's data in any
    form.

  author_contributions: >-
    Palaash Gang is the sole author and is solely responsible for
    conceptualisation, methodology, software, formal analysis, investigation,
    and writing (both the original draft and the review and editing of the
    manuscript).

  data_availability: >-
    The primary data are the numerical simulation outputs generated by the
    solver, which are fully reproducible from the run configurations and code in
    the public repository. A curated subset of the processed data and figures
    will be deposited on Zenodo at release under a DOI to be assigned
    (DOI placeholder pending deposit). The external reanalysis inputs (ERA5 from
    the Copernicus Climate Change Service and NCEP/NCAR Reanalysis 1 from
    NOAA PSL) are third-party datasets that are not redistributed through this
    work; they are re-downloadable byte-for-byte via the provided acquisition
    scripts (make data) under the providers' own licence terms, with full
    provenance and SHA-256 checksums recorded in the repository.

  code_availability: >-
    All code is publicly available in the GitHub repository at
    https://github.com/pa1aash/physics-waves, released under the MIT License.
    The repository contains the full solver, analysis pipeline, run
    configurations, and data-acquisition scripts required to reproduce every
    result in this manuscript.
