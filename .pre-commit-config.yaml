# Pre-commit hooks. Install with:
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# The forbidden-attribution hook screens staged content for tool-attribution
# strings. Its pattern expresses each token as a bracketed character class, so
# this config file does not itself contain the literal strings it screens for
# and stays clean under the whole-tree audit.
# Vendored, unmodified upstream code (the Phase-0 gate GPL-3.0 reference example)
# is excluded from every hook so it stays byte-identical to upstream. The
# whole-tree audit (scripts/audit.sh check 1, via git ls-files) still scans it.
# docs/literature/*_POOL.csv are machine-retrieved bibliographic metadata. They
# legitimately contain third-party author names, and several real researchers in
# this field carry a given name that collides with one of the screened tokens.
# The pygrep guard cannot distinguish a person's name from a tool byline, so the
# data files are excluded here -- along with manuscript/references.bib, which is
# generated from them -- and covered instead by audit check 1b, which screens them
# for the forbidden tokens OUTSIDE the author field. Same technique as authorised
# deviation 1: guards must not contain what they screen.
exclude: '^(tests/phase0_gate/dedalus_reference/|docs/literature/(CANDIDATE|VERIFIED)_POOL\.csv$|manuscript/references\.bib$)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      - id: forbidden-attribution
        name: forbidden-attribution
        language: pygrep
        entry: '(?i)[c]laude|[a]nthropic|co-[a]uthored|[g]enerated with'
        types: [text]
